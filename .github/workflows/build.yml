name: بناء تطبيق كلبسو
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: unzip -o kalbaso-termux-studio-android-source.zip
      - name: تجهيز المشروع
        run: |
          GRADLEW_PATH=$(find . -type f -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project dir is: $PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          chmod +x "$GRADLEW_PATH"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - run: cd $PROJECT_DIR && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KALBASO-APK
          path: "**/build/outputs/apk/debug/*.apk"
