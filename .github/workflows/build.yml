name: بناء تطبيق كلبسو
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: unzip -o kalbaso-termux-studio-android-source.zip
      - run: echo "sdk.dir=$ANDROID_HOME" > kalbaso-termux-studio-android-source/local.properties
      - uses: gradle/actions/setup-gradle@v3
      - run: cd kalbaso-termux-studio-android-source && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KALBASO-APK
          path: "**/*.apk"
