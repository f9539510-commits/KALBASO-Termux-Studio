name: بناء تطبيق كلبسو

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت جافا 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: فك ضغط المشروع
        run: |
          ls -la
          unzip -o kalbaso-termux-studio-android-source.zip
          ls -la
          find . -type f -name "gradlew" | head -n 20

      - name: تجهيز المشروع
        run: |
          GRADLEW_PATH=$(find . -type f -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found! Listing files:"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project dir is: $PROJECT_DIR"
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: KALBASO-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
